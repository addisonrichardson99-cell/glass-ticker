<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live stock watchlist for Meta Ray-Ban Display">
<meta name="application-name" content="Glass Ticker">
<meta name="mrbd-web-app-capable" content="yes">
<title>Glass Ticker</title>
<style>
  /* Additive display: black renders as clear, so the page stays black with bright type. */
  :root {
    --u: 1vmin;
    --fg: #ffffff;
    --dim: #9aa69e;
    --green: #00c805;
    --green-light: #8cf5a6;
    --green-soft: rgba(0, 200, 5, 0.16);
    --red: #ff5000;
    --red-soft: rgba(255, 80, 0, 0.18);
    --line: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .view { height: 100vh; padding: calc(var(--u)*4) calc(var(--u)*4.5); display: flex; flex-direction: column; gap: calc(var(--u)*2); }
  .scroll { overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  header { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u)*2); flex-shrink: 0; }
  h1 { margin: 0; font-size: calc(var(--u)*6); font-weight: 700; letter-spacing: -0.01em; }
  .sub { font-size: calc(var(--u)*3.2); color: var(--dim); }
  .up { color: var(--green-light); } .down { color: var(--red); }

  button { font: inherit; color: inherit; background: transparent; border: 2px solid transparent;
    border-radius: calc(var(--u)*2.6); cursor: pointer; text-align: left; }
  button:focus, button:focus-visible, input:focus { outline: none; border-color: var(--green-light); background: var(--green-soft); }

  .chip { padding: calc(var(--u)*1) calc(var(--u)*2.6); border-color: rgba(140,245,166,.45); color: var(--green-light);
    font-size: calc(var(--u)*3.4); font-weight: 600; border-radius: 999px; white-space: nowrap; }

  /* Watchlist */
  .summary { font-size: calc(var(--u)*3.2); color: var(--dim); margin-top: calc(var(--u)*-1); }
  .list { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: calc(var(--u)*3);
    padding: calc(var(--u)*1.6) calc(var(--u)*2.4); border-bottom-color: var(--line); border-radius: 0; }
  .row:focus { border-radius: calc(var(--u)*2.6); }
  .who { min-width: 0; }
  .sym { font-size: calc(var(--u)*4.6); font-weight: 700; display: block; }
  .name { font-size: calc(var(--u)*2.9); color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: calc(var(--u)*4.4); font-variant-numeric: tabular-nums; }
  .pill { min-width: calc(var(--u)*19); text-align: center; padding: calc(var(--u)*1) calc(var(--u)*1.6); border-radius: calc(var(--u)*1.6);
    font-size: calc(var(--u)*3.6); font-weight: 700; font-variant-numeric: tabular-nums; color: #000; background: var(--green); }
  .pill.down { background: var(--red); color: #000; }
  .pill.wait { background: var(--line); color: var(--dim); }
  .empty { color: var(--dim); font-size: calc(var(--u)*4); line-height: 1.4; }

  /* Detail */
  .bigprice { font-size: calc(var(--u)*11); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .change { font-size: calc(var(--u)*4); font-weight: 600; margin-top: calc(var(--u)*1); }
  .range { margin-top: calc(var(--u)*1); }
  .range .lbl { display: flex; justify-content: space-between; font-size: calc(var(--u)*2.9); color: var(--dim); }
  .track { position: relative; height: calc(var(--u)*1); background: var(--line); border-radius: 99px; margin: calc(var(--u)*1.2) 0; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); border-radius: 99px; opacity: .55; }
  .dot { position: absolute; top: 50%; width: calc(var(--u)*2.6); height: calc(var(--u)*2.6); border-radius: 50%;
    background: var(--green-light); transform: translate(-50%, -50%); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*1.6) calc(var(--u)*4); }
  .stat span { display: block; font-size: calc(var(--u)*2.9); color: var(--dim); }
  .stat b { font-size: calc(var(--u)*4.2); font-variant-numeric: tabular-nums; }
  .section { font-size: calc(var(--u)*3.2); color: var(--green-light); font-weight: 600; margin: calc(var(--u)*1) 0 calc(var(--u)*-1); }
  .news { padding: calc(var(--u)*2.2); border-color: var(--line); width: 100%; }
  .news .hl { font-size: calc(var(--u)*3.8); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .news .src { font-size: calc(var(--u)*2.9); color: var(--dim); margin-top: calc(var(--u)*1); display: block; }
  .actions { display: flex; gap: calc(var(--u)*2.5); flex-shrink: 0; }
  .actions button { flex: 1; text-align: center; padding: calc(var(--u)*2) calc(var(--u)*2); font-size: calc(var(--u)*3.8); font-weight: 600;
    border-color: rgba(255,255,255,.3); }
  .actions .primary { background: var(--green); color: #000; border-color: var(--green); }
  .actions .primary:focus { background: var(--green-light); border-color: #fff; }
  .actions .danger { color: var(--red); border-color: rgba(255,80,0,.5); }
  .actions .danger:focus { background: var(--red-soft); border-color: var(--red); }

  /* News reader */
  .article h2 { margin: 0; font-size: calc(var(--u)*5); line-height: 1.25; }
  .article p { font-size: calc(var(--u)*3.8); line-height: 1.45; color: #dfe6e1; margin: calc(var(--u)*2) 0 0; }

  /* Add */
  input { width: 100%; font: inherit; font-size: calc(var(--u)*4.4); color: var(--fg); background: rgba(255,255,255,.06);
    border: 2px solid var(--line); border-radius: calc(var(--u)*2.6); padding: calc(var(--u)*2.2) calc(var(--u)*2.6); }
  input::placeholder { color: var(--dim); }
  .hint { font-size: calc(var(--u)*3.2); color: var(--dim); }
  .result { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u)*2);
    padding: calc(var(--u)*1.8) calc(var(--u)*2.4); border-bottom-color: var(--line); border-radius: 0; }
  .result:focus { border-radius: calc(var(--u)*2.6); }
  .result .tag { font-size: calc(var(--u)*3); color: var(--green-light); font-weight: 600; }

  #toast { position: fixed; left: 50%; bottom: calc(var(--u)*4); transform: translateX(-50%); background: var(--green); color: #000;
    font-weight: 700; font-size: calc(var(--u)*3.6); padding: calc(var(--u)*1.4) calc(var(--u)*3.4); border-radius: 999px;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>

<section class="view" id="listView">
  <header>
    <div><h1>Watchlist</h1><div class="sub" id="status">Loading…</div></div>
    <button class="chip" id="addBtn" type="button">+ Add</button>
  </header>
  <div class="summary" id="summary"></div>
  <div class="list scroll" id="list"></div>
  <p class="empty" id="noKey" hidden>Add your Finnhub key with the setup page on your phone, then reinstall from its QR code.</p>
</section>

<section class="view scroll" id="detailView" hidden>
  <header>
    <div><h1 id="dSym"></h1><div class="sub" id="dName"></div></div>
    <button class="chip" id="backBtn" type="button">Back</button>
  </header>
  <div>
    <div class="bigprice" id="dPrice">…</div>
    <div class="change" id="dChange"></div>
    <div class="sub" id="dStatus" style="margin-top:calc(var(--u)*0.8)"></div>
  </div>
  <div class="range">
    <div class="lbl"><span>Today’s range</span><span id="dDayLbl"></span></div>
    <div class="track"><div class="fill" id="dDayFill"></div><div class="dot" id="dDayDot"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><span>Dividend yield</span><b id="sDiv">…</b></div>
    <div class="stat"><span>Beta</span><b id="sBeta">…</b></div>
    <div class="stat"><span>P/E ratio</span><b id="sPE">…</b></div>
    <div class="stat"><span>Market cap</span><b id="sCap">…</b></div>
    <div class="stat"><span>Open</span><b id="sOpen">…</b></div>
    <div class="stat"><span>Prev close</span><b id="sPrev">…</b></div>
  </div>
  <div class="range">
    <div class="lbl"><span>52-week range</span><span id="dYrLbl"></span></div>
    <div class="track"><div class="fill" id="dYrFill"></div><div class="dot" id="dYrDot"></div></div>
  </div>
  <div class="section">Latest news</div>
  <button class="news" id="newsBtn" type="button"><span class="hl" id="nHead">Loading news…</span><span class="src" id="nSrc"></span></button>
  <div class="actions">
    <button class="danger" id="removeBtn" type="button">Remove from watchlist</button>
  </div>
</section>

<section class="view scroll" id="newsView" hidden>
  <header><div class="sub" id="aMeta"></div></header>
  <div class="article"><h2 id="aHead"></h2><p id="aBody"></p></div>
  <div class="actions" style="margin-top:auto">
    <button id="aBack" type="button">Back</button>
    <button class="primary" id="aSpeak" type="button">Read aloud</button>
  </div>
</section>

<section class="view" id="addView" hidden>
  <header><h1>Add a stock</h1></header>
  <input id="q" type="text" enterkeyhint="search" autocomplete="off" autocapitalize="characters" spellcheck="false"
         placeholder="Say a company or ticker" aria-label="Company or ticker">
  <div class="hint" id="addHint">Select the box, then say something like “Nvidia” or “AAPL”.</div>
  <div class="list scroll" id="results"></div>
  <div class="actions"><button id="addBack" type="button">Done</button></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const API = 'https://finnhub.io/api/v1/';
  const REFRESH_MS = 30000;
  const MAX = 12;
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    json(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
  };

  // ---- Settings: the install link carries the key and the starting list ----
  const params = new URLSearchParams(location.search);
  if (params.get('key')) store.set('gt_key', params.get('key'));
  const key = store.get('gt_key') || '';
  const parse = s => s.split(',').map(x => x.trim().toUpperCase()).filter(Boolean).slice(0, MAX);
  let list = store.json('gt_list', null);
  const seed = params.get('s');
  if (seed && seed !== store.get('gt_seed')) { list = parse(seed); store.set('gt_seed', seed); }   // new QR = new starting list
  if (!Array.isArray(list)) list = parse(store.get('gt_syms') || 'SPY,QQQ,AAPL,TSLA,NVDA');
  const saveList = () => store.set('gt_list', JSON.stringify(list));
  saveList();

  const names = store.json('gt_names', {});
  const quotes = {}, metrics = {}, news = {};
  let lastUpdate = null, failed = false, currentSym = null;

  // ---- Formatting ----
  const money = n => n == null || isNaN(n) ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signed = (n, d = 2) => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(d);
  const time = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const ago = s => { const m = Math.round((Date.now() / 1000 - s) / 60);
    return m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
  const cap = m => !m ? '—' : m >= 1e6 ? '$' + (m / 1e6).toFixed(2) + 'T' : m >= 1e3 ? '$' + (m / 1e3).toFixed(1) + 'B' : '$' + Math.round(m) + 'M';
  const ymd = d => d.toISOString().slice(0, 10);
  const isUp = q => (q.d || 0) >= 0;

  async function api(path) {
    const sep = path.includes('?') ? '&' : '?';
    const res = await fetch(API + path + sep + 'token=' + encodeURIComponent(key), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  // ---- Data ----
  async function refreshQuotes() {
    if (!key) return;
    const syms = [...list];
    const results = await Promise.allSettled(syms.map(s => api('quote?symbol=' + encodeURIComponent(s))));
    let any = false;
    results.forEach((r, i) => { if (r.status === 'fulfilled' && r.value && r.value.c) { quotes[syms[i]] = r.value; any = true; } });
    failed = syms.length > 0 && !any;
    if (any) lastUpdate = new Date();
    updateList(); if (currentSym) fillDetail();
  }

  async function loadName(sym) {
    if (names[sym]) return;
    try {
      const p = await api('stock/profile2?symbol=' + encodeURIComponent(sym));
      let n = p && p.name;
      if (!n) {  // ETFs have no profile on the free tier; fall back to search
        const s = await api('search?q=' + encodeURIComponent(sym));
        const hit = (s.result || []).find(r => r.symbol === sym);
        n = hit && hit.description;
      }
      if (n) { names[sym] = titleCase(n); store.set('gt_names', JSON.stringify(names)); updateList(); if (currentSym === sym) fillDetail(); }
    } catch {}
  }
  const titleCase = s => /[a-z]/.test(s) ? s : s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\b(Etf|Spdr|Qqq|Inc)\b/g, w => w === 'Inc' ? 'Inc' : w.toUpperCase());

  async function loadMetrics(sym) {
    if (metrics[sym]) return;
    try { const m = await api('stock/metric?symbol=' + encodeURIComponent(sym) + '&metric=all'); metrics[sym] = (m && m.metric) || {}; }
    catch { metrics[sym] = {}; }
    if (currentSym === sym) fillDetail();
  }

  async function loadNews(sym) {
    if (news[sym]) return;
    const to = new Date(), from = new Date(Date.now() - 7 * 864e5);
    try {
      const items = await api('company-news?symbol=' + encodeURIComponent(sym) + '&from=' + ymd(from) + '&to=' + ymd(to));
      news[sym] = (Array.isArray(items) ? items : []).filter(n => n.headline).sort((a, b) => b.datetime - a.datetime)[0] || null;
    } catch { news[sym] = null; }
    if (currentSym === sym) fillDetail();
  }

  // ---- Watchlist view ----
  function statusText() {
    if (failed && !lastUpdate) return 'Can’t reach prices';
    if (!lastUpdate) return 'Loading…';
    const newest = Math.max(0, ...Object.values(quotes).map(q => q.t || 0)) * 1000;
    if (newest && Date.now() - newest > 30 * 60 * 1000) return 'Market closed, last ' + time(new Date(newest));
    return (failed ? 'Retrying, ' : 'Updated ') + time(lastUpdate);
  }

  function buildList() {
    const el = $('list'); el.textContent = '';
    if (!list.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Your list is empty. Select + Add to pick a stock.'; el.appendChild(p); }
    list.forEach(sym => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'row'; b.dataset.sym = sym;
      b.innerHTML = '<span class="who"><span class="sym"></span><span class="name"></span></span><span class="price">…</span><span class="pill wait">…</span>';
      b.querySelector('.sym').textContent = sym;
      b.addEventListener('click', () => go({ v: 'detail', sym }));
      el.appendChild(b);
      loadName(sym);
    });
    updateList();
  }

  function updateList() {
    $('status').textContent = statusText();
    let up = 0, down = 0;
    document.querySelectorAll('.row').forEach(b => {
      const sym = b.dataset.sym, q = quotes[sym];
      b.querySelector('.name').textContent = names[sym] || '';
      if (!q) return;
      isUp(q) ? up++ : down++;
      b.querySelector('.price').textContent = money(q.c);
      const pill = b.querySelector('.pill');
      pill.textContent = signed(q.dp || 0) + '%';
      pill.className = 'pill ' + (isUp(q) ? 'up' : 'down');
      b.setAttribute('aria-label', sym + ', ' + money(q.c) + ', ' + signed(q.dp || 0) + ' percent');
    });
    $('summary').textContent = up + down ? up + ' up, ' + down + ' down today' : '';
  }

  // ---- Detail view ----
  function setRange(prefix, low, high, cur) {
    const ok = low && high && high > low && cur;
    const pct = ok ? Math.min(100, Math.max(0, (cur - low) / (high - low) * 100)) : 0;
    $(prefix + 'Fill').style.width = pct + '%';
    $(prefix + 'Dot').style.left = pct + '%';
    $(prefix + 'Dot').hidden = !ok;
    $(prefix + 'Lbl').textContent = ok ? money(low) + ' – ' + money(high) : '—';
  }

  function fillDetail() {
    const sym = currentSym, q = quotes[sym], m = metrics[sym], n = news[sym];
    $('dSym').textContent = sym;
    $('dName').textContent = names[sym] || '';
    $('dStatus').textContent = statusText();
    if (q) {
      $('dPrice').textContent = money(q.c);
      const ch = $('dChange');
      ch.textContent = signed(q.d || 0) + ' (' + signed(q.dp || 0) + '%) Today';
      ch.className = 'change ' + (isUp(q) ? 'up' : 'down');
      $('sOpen').textContent = money(q.o); $('sPrev').textContent = money(q.pc);
      setRange('dDay', q.l, q.h, q.c);
    }
    if (m) {
      const dy = m.currentDividendYieldTTM ?? m.dividendYieldIndicatedAnnual;
      $('sDiv').textContent = dy ? Number(dy).toFixed(2) + '%' : (dy === 0 ? 'None' : '—');
      $('sBeta').textContent = m.beta != null ? Number(m.beta).toFixed(2) : '—';
      const pe = m.peTTM ?? m.peBasicExclExtraTTM;
      $('sPE').textContent = pe ? Number(pe).toFixed(1) : '—';
      $('sCap').textContent = cap(m.marketCapitalization);
      setRange('dYr', m['52WeekLow'], m['52WeekHigh'], q && q.c);
    }
    if (n === undefined) { $('nHead').textContent = 'Loading news…'; $('nSrc').textContent = ''; $('newsBtn').disabled = true; }
    else if (!n) { $('nHead').textContent = 'No recent news for ' + sym + '.'; $('nSrc').textContent = ''; $('newsBtn').disabled = true; }
    else { $('nHead').textContent = n.headline; $('nSrc').textContent = (n.source || 'News') + ', ' + ago(n.datetime); $('newsBtn').disabled = false; }
  }

  let removeArmed = null;
  function resetRemove() { clearTimeout(removeArmed); removeArmed = null; $('removeBtn').textContent = 'Remove from watchlist'; }
  $('removeBtn').addEventListener('click', () => {
    if (!removeArmed) { $('removeBtn').textContent = 'Tap again to remove'; removeArmed = setTimeout(resetRemove, 3000); return; }
    const sym = currentSym; resetRemove();
    removeSymbol(sym);
    history.back();
  });

  // ---- News reader ----
  function fillArticle() {
    const n = news[currentSym]; if (!n) return;
    $('aMeta').textContent = currentSym + ', ' + (n.source || 'News') + ', ' + ago(n.datetime);
    $('aHead').textContent = n.headline;
    $('aBody').textContent = n.summary || 'No summary available for this story.';
    $('aSpeak').hidden = !('speechSynthesis' in window);
  }
  $('aSpeak').addEventListener('click', () => {
    const n = news[currentSym]; if (!n || !('speechSynthesis' in window)) return;
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); $('aSpeak').textContent = 'Read aloud'; return; }
    const u = new SpeechSynthesisUtterance(n.headline + '. ' + (n.summary || ''));
    u.onend = u.onerror = () => { $('aSpeak').textContent = 'Read aloud'; };
    speechSynthesis.speak(u); $('aSpeak').textContent = 'Stop';
  });

  // ---- Add view ----
  let searchSeq = 0;
  async function search(text) {
    const q = text.trim(); const box = $('results'); box.textContent = '';
    if (!q) { $('addHint').textContent = 'Select the box, then say something like “Nvidia” or “AAPL”.'; return; }
    $('addHint').textContent = 'Searching “' + q + '”…';
    const seq = ++searchSeq;
    try {
      const r = await api('search?q=' + encodeURIComponent(q));
      if (seq !== searchSeq) return;
      const hits = (r.result || []).filter(h => !h.symbol.includes('.') && /Common Stock|ETP|ADR|ETF/i.test(h.type || 'Common Stock')).slice(0, 5);
      if (!hits.length) { $('addHint').textContent = 'No US stocks match “' + q + '”. Try the ticker.'; return; }
      $('addHint').textContent = 'Select one to add it.';
      hits.forEach(h => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'result';
        const left = document.createElement('span'); left.className = 'who';
        left.innerHTML = '<span class="sym"></span><span class="name"></span>';
        left.querySelector('.sym').textContent = h.symbol;
        left.querySelector('.name').textContent = titleCase(h.description || '');
        const tag = document.createElement('span'); tag.className = 'tag';
        tag.textContent = list.includes(h.symbol) ? 'On list' : 'Add';
        b.append(left, tag);
        b.addEventListener('click', () => {
          if (h.description && !names[h.symbol]) { names[h.symbol] = titleCase(h.description); store.set('gt_names', JSON.stringify(names)); }
          addSymbol(h.symbol);
          history.back();
        });
        box.appendChild(b);
      });
      box.firstChild.focus();
    } catch { $('addHint').textContent = 'Search failed. Check your connection and try again.'; }
  }
  $('q').addEventListener('change', e => search(e.target.value));
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) search(e.target.value); });

  // ---- List changes ----
  function addSymbol(sym) {
    sym = String(sym).trim().toUpperCase();
    if (!sym) return 'No symbol given.';
    if (list.includes(sym)) { toast(sym + ' is already on your list'); return sym + ' is already on the watchlist.'; }
    if (list.length >= MAX) { toast('List is full (' + MAX + ')'); return 'The watchlist is full.'; }
    list.push(sym); saveList(); buildList(); refreshQuotes();
    toast('Added ' + sym); lastFocus = sym;
    return 'Added ' + sym + ' to the watchlist.';
  }
  function removeSymbol(sym) {
    sym = String(sym).trim().toUpperCase();
    if (!list.includes(sym)) return sym + ' is not on the watchlist.';
    list = list.filter(s => s !== sym); delete quotes[sym]; saveList(); buildList();
    toast('Removed ' + sym); lastFocus = null;
    return 'Removed ' + sym + ' from the watchlist.';
  }

  let toastTimer;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---- Navigation (works with the glasses' Back gesture through browser history) ----
  let lastFocus = null;
  const views = ['listView', 'detailView', 'newsView', 'addView'];
  function show(id) { views.forEach(v => $(v).hidden = v !== id); }
  function go(state) { history.pushState(state, ''); apply(state); }
  function apply(st) {
    st = st || { v: 'list' };
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    $('aSpeak').textContent = 'Read aloud';
    if (st.v === 'detail' && list.includes(st.sym)) {
      const fresh = currentSym !== st.sym; currentSym = st.sym; lastFocus = st.sym;
      resetRemove(); show('detailView'); fillDetail();
      loadMetrics(st.sym); loadNews(st.sym);
      if (fresh) { $('detailView').scrollTop = 0; $('backBtn').focus(); }
      else $('newsBtn').focus();   // coming back from the article
    } else if (st.v === 'news' && news[st.sym]) {
      currentSym = st.sym; show('newsView'); fillArticle(); $('newsView').scrollTop = 0; $('aBack').focus();
    } else if (st.v === 'add') {
      show('addView'); $('q').value = ''; $('results').textContent = '';
      $('addHint').textContent = 'Select the box, then say something like “Nvidia” or “AAPL”.'; $('q').focus();
    } else {
      currentSym = null; show('listView'); updateList();
      const target = (lastFocus && document.querySelector('.row[data-sym="' + lastFocus + '"]')) || document.querySelector('.row') || $('addBtn');
      target.focus();
    }
  }
  window.addEventListener('popstate', e => apply(e.state));
  $('addBtn').addEventListener('click', () => go({ v: 'add' }));
  $('backBtn').addEventListener('click', () => history.back());
  $('aBack').addEventListener('click', () => history.back());
  $('addBack').addEventListener('click', () => history.back());
  $('newsBtn').addEventListener('click', () => { if (news[currentSym]) go({ v: 'news', sym: currentSym }); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshQuotes(); });

  // ---- Voice commands through Meta AI (WebMCP preview; does nothing where unsupported) ----
  function registerVoiceTools() {
    const mc = document.modelContext || navigator.modelContext;
    if (!mc || typeof mc.registerTool !== 'function') return;
    const reply = text => ({ content: [{ type: 'text', text }] });
    const tools = [
      { name: 'addStock', description: 'Add a stock to the watchlist by ticker symbol, for example NVDA for Nvidia.',
        inputSchema: { type: 'object', properties: { symbol: { type: 'string', description: 'US ticker symbol' } }, required: ['symbol'] },
        execute: async ({ symbol }) => {
          const sym = String(symbol || '').trim().toUpperCase();
          try { const q = await api('quote?symbol=' + encodeURIComponent(sym)); if (!q || !q.c) return reply(sym + ' was not found.'); }
          catch { return reply('Could not check ' + sym + ' right now.'); }
          return reply(addSymbol(sym));
        } },
      { name: 'removeStock', description: 'Remove a stock from the watchlist by ticker symbol.',
        inputSchema: { type: 'object', properties: { symbol: { type: 'string', description: 'US ticker symbol' } }, required: ['symbol'] },
        execute: async ({ symbol }) => { const r = removeSymbol(symbol); if (currentSym && !list.includes(currentSym)) go({ v: 'list' }); return reply(r); } },
      { name: 'showStock', description: 'Open the details screen for a stock already on the watchlist.',
        inputSchema: { type: 'object', properties: { symbol: { type: 'string', description: 'US ticker symbol' } }, required: ['symbol'] },
        execute: async ({ symbol }) => { const s = String(symbol).trim().toUpperCase();
          if (!list.includes(s)) return reply(s + ' is not on the watchlist.'); go({ v: 'detail', sym: s }); return reply('Showing ' + s + '.'); } }
    ];
    tools.forEach(t => { try { mc.registerTool(t); } catch {} });
  }

  // ---- Start ----
  history.replaceState({ v: 'list' }, '', location.pathname + location.search);
  if (!key) { $('noKey').hidden = false; $('addBtn').hidden = true; $('status').textContent = 'Setup needed'; }
  else {
    buildList(); apply({ v: 'list' }); refreshQuotes(); registerVoiceTools();
    setInterval(() => { if (!document.hidden) refreshQuotes(); }, REFRESH_MS);
  }
})();
</script>
</body>
</html>
