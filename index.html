<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live stock watchlist for Meta Ray-Ban Display">
<meta name="application-name" content="Glass Ticker">
<meta name="mrbd-web-app-capable" content="yes">
<title>Glass Ticker</title>
<style>
  /* Additive display: black shows as clear, so keep the background black and text bright. */
  :root { --fg:#ffffff; --dim:#a8b0ba; --up:#5ee08a; --down:#ff7a7a; --focus:#ffffff; }
  html, body { margin:0; height:100%; background:#000; color:var(--fg); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { box-sizing:border-box; height:100vh; padding:4vh 4vw; display:flex; flex-direction:column; gap:1.6vh; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  h1 { margin:0; font-size:max(26px, 5vh); font-weight:700; }
  .meta { font-size:max(16px, 3vh); color:var(--dim); }
  .list { display:flex; flex-direction:column; gap:0.8vh; flex:1; min-height:0; }
  button { font:inherit; color:inherit; background:transparent; cursor:pointer;
    border:2px solid transparent; border-radius:14px; }
  button:focus, button:focus-visible { outline:none; border-color:var(--focus); background:rgba(255,255,255,.14); }
  .row { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:3vw;
    padding:0.9vh 2.4vw; font-size:max(20px, 4.2vh); text-align:left; }
  .sym { font-weight:700; }
  .chg { min-width:5.5em; text-align:right; font-size:0.85em; }
  .up { color:var(--up); } .down { color:var(--down); }
  .detail { display:flex; flex-direction:column; gap:1.2vh; flex:1; }
  .big { font-size:max(44px, 10vh); font-weight:700; line-height:1; margin-top:1vh; }
  .change { font-size:max(22px, 4.4vh); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:0.8vh 4vw; font-size:max(18px, 3.4vh); margin-top:1vh; }
  .stats span { color:var(--dim); }
  .actions { display:flex; gap:3vw; margin-top:auto; }
  .actions button { flex:1; padding:1.4vh 2vw; font-size:max(20px, 3.8vh); border-color:rgba(255,255,255,.35); }
  .notice { font-size:max(20px, 3.8vh); line-height:1.35; color:var(--dim); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main id="app">
  <section id="listView">
    <header><h1>Watchlist</h1><div class="meta" id="status">Loading…</div></header>
    <div class="list" id="list"></div>
    <p class="notice" id="noKey" hidden>Add your Finnhub key with the setup page on your phone, then reinstall from its QR code.</p>
  </section>

  <section id="detailView" class="detail" hidden>
    <header><h1 id="dSym"></h1><div class="meta" id="dTime"></div></header>
    <div class="big" id="dPrice"></div>
    <div class="change" id="dChange"></div>
    <div class="stats">
      <div><span>Open</span> <b id="dOpen"></b></div>
      <div><span>Prev</span> <b id="dPrev"></b></div>
      <div><span>High</span> <b id="dHigh"></b></div>
      <div><span>Low</span> <b id="dLow"></b></div>
    </div>
    <div class="actions">
      <button id="backBtn" type="button">Back</button>
      <button id="refreshBtn" type="button">Refresh</button>
    </div>
  </section>
</main>

<script>
(() => {
  const REFRESH_MS = 30000;
  const MAX_SYMBOLS = 7;          // what fits on the 600×600 lens without scrolling
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  // Settings come from the install link (?key=…&s=…) and are remembered on the glasses.
  const params = new URLSearchParams(location.search);
  if (params.get('key')) store.set('gt_key', params.get('key'));
  if (params.get('s')) store.set('gt_syms', params.get('s'));
  const key = store.get('gt_key') || '';
  const symbols = (store.get('gt_syms') || 'SPY,QQQ,AAPL,TSLA,NVDA')
    .split(',').map(s => s.trim().toUpperCase()).filter(Boolean).slice(0, MAX_SYMBOLS);

  const quotes = {};
  let lastUpdate = null, failed = false, current = null;
  const $ = id => document.getElementById(id);

  const money = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const time = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const pct = q => (q.dp >= 0 ? '▲ ' : '▼ ') + Math.abs(q.dp || 0).toFixed(2) + '%';
  const dir = q => (q.d || 0) >= 0 ? 'up' : 'down';

  async function fetchQuote(sym) {
    const url = 'https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(sym) + '&token=' + encodeURIComponent(key);
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const q = await res.json();
    return q && q.c ? q : null;   // Finnhub returns zeros for unknown symbols
  }

  async function refresh() {
    if (!key) return;
    const results = await Promise.allSettled(symbols.map(fetchQuote));
    let any = false;
    results.forEach((r, i) => { if (r.status === 'fulfilled' && r.value) { quotes[symbols[i]] = r.value; any = true; } });
    failed = !any;
    if (any) lastUpdate = new Date();
    update();
  }

  // Build the list once so focus stays put when prices refresh.
  function buildList() {
    const list = $('list');
    symbols.forEach(sym => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'row'; b.dataset.sym = sym;
      b.innerHTML = '<span class="sym"></span><span class="price">…</span><span class="chg"></span>';
      b.querySelector('.sym').textContent = sym;
      b.addEventListener('click', () => openDetail(sym));
      list.appendChild(b);
    });
  }

  function statusText() {
    if (failed && !lastUpdate) return 'Can’t reach prices';
    if (!lastUpdate) return 'Loading…';
    const newest = Math.max(...Object.values(quotes).map(q => q.t || 0)) * 1000;
    const stale = newest && Date.now() - newest > 30 * 60 * 1000;
    if (stale) return 'Closed, last ' + time(new Date(newest));
    return (failed ? 'Retrying, ' : '') + time(lastUpdate);
  }

  function update() {
    $('status').textContent = statusText();
    document.querySelectorAll('.row').forEach(b => {
      const q = quotes[b.dataset.sym];
      if (!q) return;
      b.querySelector('.price').textContent = money(q.c);
      const c = b.querySelector('.chg');
      c.textContent = pct(q); c.className = 'chg ' + dir(q);
      b.setAttribute('aria-label', b.dataset.sym + ' ' + money(q.c) + ' ' + pct(q));
    });
    if (current) fillDetail(current);
  }

  function fillDetail(sym) {
    const q = quotes[sym];
    $('dSym').textContent = sym;
    $('dTime').textContent = statusText();
    if (!q) { $('dPrice').textContent = '…'; return; }
    $('dPrice').textContent = money(q.c);
    const ch = $('dChange');
    ch.textContent = (q.d >= 0 ? '▲ +' : '▼ ') + Number(q.d || 0).toFixed(2) + ' (' + pct(q).slice(2) + ')';
    ch.className = 'change ' + dir(q);
    $('dOpen').textContent = money(q.o); $('dPrev').textContent = money(q.pc);
    $('dHigh').textContent = money(q.h); $('dLow').textContent = money(q.l);
  }

  function showList(focusSym) {
    current = null;
    $('detailView').hidden = true; $('listView').hidden = false;
    const target = document.querySelector('.row[data-sym="' + (focusSym || symbols[0]) + '"]');
    if (target) target.focus();
  }

  function openDetail(sym) {
    current = sym;
    history.pushState({ sym }, '', '#' + sym);   // lets the glasses' Back gesture return to the list
    fillDetail(sym);
    $('listView').hidden = true; $('detailView').hidden = false;
    $('backBtn').focus();
  }

  window.addEventListener('popstate', () => { const s = current; showList(s); });
  $('backBtn').addEventListener('click', () => history.back());
  $('refreshBtn').addEventListener('click', refresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  if (!key) { $('noKey').hidden = false; $('status').textContent = 'Setup needed'; }
  else { buildList(); showList(); refresh(); setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS); }
})();
</script>
</body>
</html>
